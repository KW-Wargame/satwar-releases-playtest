 Ganymede are locked in a 1:2:4 chain called the Laplace resonance. It keeps Io's orbit slightly eccentric, and the tides that result heat Io enough to make it the most volcanic body in the solar system, as Peale, Cassen and Reynolds predicted in 1979, days before Voyager 1 photographed its eruptions."],sources:["peale1979","jplSatElem"]},lambert:{title:"Lambert's problem: planning an intercept",text:["To meet something, you pick where it will be and when. Lambert's problem asks which orbit joins your position now to that point in exactly that time. For each flight time there is one answer (for a single trip around), and the planner solves it with the universal-variable method from Curtis's textbook, which handles ellipses and hyperbolas alike.","Short flight times need fast, expensive orbits; long ones are cheap but give the target time to move. The trade between delta-v and time is the heart of every move on this map.","Aiming at a track means aiming at an estimate. The planner shows how wide the target's uncertainty will be at the intercept node; a wide ellipse there means a correction burn later."],sources:["curtis","bmw"]},deltaV:{title:"Delta-v and the rocket equation",text:["A ship's fuel is measured as delta-v: the total change in velocity it can still make. The rocket equation sets it, \u0394v = v\u2091 ln(m\u2080 / m\u2081), where v\u2091 is the exhaust velocity and m\u2080 / m\u2081 the ratio of full to empty mass.","The ships here use 2040-era nuclear thermal rockets: a reactor heats hydrogen to about 900 s of specific impulse, an exhaust velocity of 8.8 km/s, twice the best chemical engines. NASA's Rover and NERVA programs ground-tested twenty such reactors between 1955 and 1972. The ship designs themselves are fiction.","Distances around Jupiter are vast: Ganymede's orbit is 6.7 million km around. A fast intercept can cost more delta-v than a ship carries, which is why the timing of every burn matters."],sources:["nasaRocketEq","borowski2012","nist811"]},irDetect:{title:"Why nothing is truly hidden in space",text:["Everything warm glows in infrared. A hull radiates P = \u03B5\u03C3T\u2074A (the Stefan\u2013Boltzmann law): emissivity \u03B5, temperature T, area A. That glow spreads out with the square of distance, and a sensor sees the ship once the light reaching it beats the sensor's own noise.","Stealth here means keeping that glow small: cold hulls, low-emissivity coatings, small areas facing the enemy. TRK 4417 radiates a few hundred watts and can only be seen from about 170,000 km. INDUSTRIAL INTENT, a warm freighter, shows up from 10 million km away."],sources:["codata2018","hudson"]},burnFlash:{title:"Burns give you away",text:["A drive plume radiates hundreds of megawatts, millions of times more than a cold hull. Every friendly sensor in the system sees it, whatever its range. That is how TRK 4417 was found at all.","The same is true for you. Each correction burn tells the hostile where HYDRA is and roughly where it's going. Burn when you have to, not when you can.","Burns in the game happen instantly, but the plume stays visible for 20 minutes, about as long as a real burn of this size would last."],sources:["hudson","codata2018"]},bearingsOnly:{title:"Lines of bearing and triangulation",text:["A passive IR sensor tells you which direction a target is in, not how far away it is. One sensor gives a line; the target is somewhere along it. Two sensors far apart give two lines that cross, and the crossing is a fix. This is triangulation.","The game keeps its estimate with an extended Kalman filter, the standard tool for tracking. The red ellipse is the filter's 2\u03C3 uncertainty: about 86 % of the time the true target is inside it. Between sightings the ellipse grows, because a small error in velocity becomes a large error in position over hours.","If a shot is aimed at an estimate that is badly wrong, it misses. Fresh, crossing lines of bearing are worth more than any weapon."],sources:["barShalom"]},radarEsm:{title:"Radar: seeing, and being heard",text:["Radar measures range as well as bearing, so one radar gives a tight fix. But its pulse travels out and back, and the echo weakens with the fourth power of range. An enemy listening with a passive receiver only needs the outbound pulse, which weakens with the square of range.","So the listener hears a radar from much farther than the radar can see the listener. Turning on radar breaks emission control (EMCON): it tells every hostile receiver for a million kilometres where you are."],sources:["skolnik"]},planetshine:{title:"Hiding behind and against Jupiter",text:["Jupiter blocks any line of sight that passes through it: a ship on the far side is invisible. Near the planet's bright disc, the background glare swamps faint targets, so sensors see a cold hull at only a fraction of their usual range.","Jupiter reflects about half the sunlight that hits it (geometric albedo 0.538) and glows in the infrared at a black-body temperature of 110 K. In the game a target seen within three Jupiter radii of the disc is 25 times harder to detect."],sources:["nasaJupiter"]},lightTime:{title:"Light-time: why you command from here",text:["Nothing travels faster than light, 299,792.458 km/s. Across the Jovian system a signal takes a few seconds. To Earth it takes 33 to 54 minutes, depending on where the two planets are in their orbits.","An order from Earth would arrive an hour after the question was asked. Decisions in a fight like this one have to be made on scene, by the operator at this console."],sources:["siBrochure","nasaJupiter"]},engagement:{title:"Weapons and uncertainty",text:["The chance of a kill falls as the target's uncertainty grows. A kinetic interceptor can correct for a few thousand kilometres of error; a laser needs to know where the target is to within tens of kilometres.","Kinetic weapons are held when the target is within 2,000 km of INDUSTRIAL INTENT: debris could hit her, and a hull breach near her nuclear reagents is the hazard the operation order calls the NSWR exclusion zone.","Weapon performance in the game is invented for play."],sources:[]},radiation:{title:"Jupiter's radiation belts",text:["Jupiter traps charged particles in the most intense radiation belts of any planet. NASA flew Juno in a polar orbit partly to dip under them and limit the dose to its electronics.","In the operation order the belts are a hazard to plan around and a source of sensor noise near Io. The first playtest doesn't model dose yet."],sources:["bolton2017"]},simplified:{title:"What this game simplifies",text:["Real: Jupiter's and the moons' masses, sizes and orbits; Kepler's laws; exact two-body motion; Lambert intercepts; the rocket equation; the Stefan\u2013Boltzmann law and inverse-square detection; bearings-only Kalman tracking; occultation by Jupiter.","Simplified: everything moves in one plane (the real moons tilt by less than half a degree). Ships feel only Jupiter's gravity, not the moons'. Moons follow mean orbital elements, which JPL notes are not meant for precise ephemerides: positions are close, not exact. Burns are instantaneous.","Invented for play: every ship, operator and event; sensor sensitivities; radar ranges; weapon performance. These are tuned so the scenario can be won, and are listed as game values in the code."],sources:["jplSatElem"]}};var R=t=>document.getElementById(t),ut=t=>String(t).replace(/[&<>"]/g,e=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[e]),X=(t,e)=>{t._html!==e&&(t.innerHTML=e,t._html=e)},z=t=>t&&it[t]?`<button type="button" class="why" data-why="${t}" title="${ut(it[t].title)}">WHY?</button>`:"",Q=t=>t>=1e5?`${(t/1e6).toFixed(3)} \xD7 10\u2076 KM`:`${Math.round(t).toLocaleString("en-US")} KM`,st=t=>`${t.toFixed(2)} KM/S`,yt=[0,1,60,600,3e3,1e4,3e4],Mo=t=>t===0?"II":t>=1e3?`${t/1e3}K\xD7`:`${t}\xD7`,M={warp:0,logCount:0,bannerUntil:0,onWhy:null};function He(t){let e=n=>{let a=n.target.closest("button");if(!(!a||a.disabled)){if(a.dataset.why){
