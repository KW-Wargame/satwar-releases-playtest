<script>

 {c:1,bg:'console',spot:[1508,22,396,130],tag:'EMCON · Escalation',who:'cmd',t:'QUIET means you are only listening. Escalation counts toward war: <em>at 100 you lose</em>.'},
 {c:1,bg:'console',spot:[1310,176,590,170],tag:'Overview · F4',who:'cmd',t:'Every contact, nearest first. Click a row to select it.',keys:[['F4','open']],click:1},
 {c:1,bg:'console',spot:[1310,552,590,188],tag:'Selected item',who:'cmd',t:'Everything you know about what you picked. The <em>±</em> is how unsure you are of where it is.'},

 {c:1,bg:'console',spot:[622,972,642,76],tag:'Dock · 1–0',who:'cmd',t:'The dock: everything HYDRA can do, on keys <em>1 to 0</em>. Grey means not now. Hover over it to see why.',keys:[['1–0','actions']]},
 {c:1,bg:'console',spot:[442,966,176,84],tag:'Δv · fuel',who:'cmd',t:'Your fuel, as Δv: <em>8.66 km/s</em> for the whole operation. Every burn spends some.'},
 {c:1,bg:'console',spot:[1278,966,206,84],tag:'Heat',who:'cmd',t:'How bright you look in infrared. <em>SEEN</em> means the inspector can see you.'},
 {c:1,bg:'console',spot:[84,928,292,142],tag:'Events',who:'cmd',t:'News, as it happens. This first report is how the operation starts.'},

 {c:2,bg:'sigint',who:'cmd',t:'The inspector <em>reports home after every move</em>, in a short radio burst. If it sees a warship coming, it goes quiet for six hours. So we listen first.'},
 {c:2,bg:'console',spot:[798,972,58,76],tag:'Key 4 · BUOY',who:'cmd',t:'Drop a buoy: a second listener. Two ears far apart can pinpoint a radio.',keys:[['4','BUOY']],click:1},
 {c:2,bg:'console',spot:[784,86,336,32],tag:'Time rate',who:'cmd',t:'Start the clock. <em>60×</em> is a good speed. Watch TRK 4417 creep toward ORIEL-36.',keys:[[']','faster'],['Space','pause']],click:1},
 {c:2,bg:'sigint',spot:[350,252,668,368],tag:'SIGINT · F2',who:'cmd',t:'F2 opens SIGINT. Every bright dash on the waterfall is a burst somebody sent.',keys:[['F2','SIGINT']]},
 {c:2,bg:'sigint',spot:[350,692,668,158],tag:'Recordings',who:'cmd',t:'Your recordings, newest first. Click the latest one from TRK 4417.',keys:[['↑ ↓','choose']],click:1},
 {c:2,bg:'sigint',spot:[1038,612,184,34],tag:'Find direction',who:'cmd',t:'FIND DIRECTION. Bearings from your two listeners cross where it is.',keys:[['D','find direction']],click:1},
 {c:2,bg:'sigint',spot:[1036,484,612,162],tag:'Identify',who:'cmd',t:'IDENTIFY SIGNAL names its command channel: the bonus goal, and the key to jamming it. <em>Too weak?</em> Wait for a closer burst.',keys:[['I','identify']],click:1},

 {c:3,bg:'planner',spot:[1318,289,572,22],tag:'ORIEL-36',who:'cmd',t:'Select <em>ORIEL-36</em> in the Overview. You will meet the inspector where it is going.',click:1},
 {c:3,bg:'planner',spot:[96,280,612,250],tag:'Planner · F3',who:'cmd',t:'F3 opens the planner. Each cell is a real trip: <em>wait</em> this long, <em>fly</em> this long, pay this much fuel. Blue is cheap; red crashes into Jupiter.',keys:[['F3','planner']]},
 {c:3,bg:'planner',spot:[364,240,262,26],tag:'Cheapest',who:'cmd',t:'Pick <em>CHEAPEST</em>: wait 18 hours, fly 3, pay 1.9 km/s.',click:1},
 {c:3,bg:'planner',spot:[96,578,620,192],tag:'Burn',who:'cmd',t:'BURN AT T+18:00 schedules the burn for you. Then speed time up and coast.',click:1},
 {c:3,bg:'console',spot:[740,972,58,76],tag:'Key 3 · MATCH',who:'cmd',t:'Arriving isn\'t stopping. When you get there, <em>MATCH</em> brakes you alongside ORIEL-36.',keys:[['3','MATCH']],click:1},

 {c:4,bg:'heat',who:'trk',radio:1,t:'MOVE COMPLETE · TARGET IN VIEW · NO ESCORT SEEN'},
 {c:4,bg:'heat',spot:[480,160,665,490],tag:'Thermal forecast · F7',who:'cmd',t:'As long as it thinks it\'s alone, it keeps talking. F7 shows <em>when you\'ll be seen</em> and when Jupiter\'s shadow hides you.',keys:[['F7','heat']]},
 {c:4,bg:'console',spot:[912,972,58,76],tag:'Key 6 · DARK',who:'cmd',t:'Go dark: store your waste heat for about <em>3.5 hours</em>. You only get one, so use it once you are alongside.',keys:[['6','DARK']],click:1},
 {c:4,bg:'ir',spot:[960,500,330,90],tag:'Telescope',who:'cmd',t:'LOOK points the telescope. Up close you\'ll see its hull.',keys:[['2','LOOK'],['I / V','infrared / visible'],['Esc','close']]},

 {c:5,bg:'options',spot:[995,510,212,320],tag:'Right-click',who:'cmd',t:'Right-click TRK 4417 for every option and what it costs. Destroying it leaves debris: <em>never here</em>.',click:1},
 {c:5,bg:'hover_jam',spot:[1018,668,330,318],tag:'Jam its orders · 7',who:'cmd',t:'Its handler is millions of kilometres away. <em>Cut the line for 3 hours</em> and it gives up. A red cross on the card means: not yet.',keys:[['7','JAM']]},
 {c:5,bg:'jam',spot:[1508,22,396,130],tag:'Escalation',who:'cmd',t:'Jamming is loud: <em>+2 escalation an hour</em>. Hold it for 3 hours, then press 7 again to stop.',keys:[['7','start / stop']]},

 {c:6,bg:'debrief',spot:[118,108,1052,562],tag:'Debrief',who:'cmd',t:'It\'s climbing away. ORIEL-36 is still imaging, and there is not one piece of debris. <em>Good work, Operator.</em>'},
 {c:6,bg:'keyart_debrief_lost',who:'cmd',panel:'ends',t:'One good ending, four bad ones. The debrief always tells you which goal failed.'},
 {c:6,bg:'keyart_debrief',panel:'finish'}
];

var $=function(i){return document.getElementById(i)};
var stage=$('stage'),view=$('view'),layer=$('layer'),spot=$('spot'),dlg=$('dlg'),cards=$('cards');
var imgs=[$('bgA'),$('bgB')],front=0,cur=-1,typing=null;

// chapter tabs
var firstOf=[];S.forEach(function(s,i){if(firstOf[s.c]==null)firstOf[s.c]=i;});
$('chapters').innerHTML=CH.map(function(n,i){return '<a href="#s'+(firstOf[i]+1)+'" data-c="'+i+'"><span>'+(i?('0'+i):'00')+'</span>'+n+'</a>';}).join('');

function kb(k){return k.split(' ').map(function(x){return '<kbd>'+x+'</kbd>';}).join('');}
var PANELS={
 title:function(){return '<div class="title"><div class="kick">Operator\'s Handbook · PC</div><h1>SATWAR</h1><h2>The Shadowing</h2>'+
  '<p>A guided tour of the screen and every step of your first operation. About ten minutes.</p>'+
  '<div class="btns"><button class="btn big" data-go="1">Begin the tour<svg class="ico"><use href="#i-arrow"/></svg></button>'+
  '<a class="btn ghost big" href="reference.html"><svg class="ico"><use href="#i-book"/></svg>Quick reference</a></div>'+
  '<div class="facts"><span>Low Jupiter orbit · 2041</span><span>3 game days</span><span>Keyboard &amp; mouse</span></div></div>';},
 cast:function(){
  var c=[['p-sentinel','HYDRA BRAVO','Your warship','own','You'],['p-oriel','ORIEL-36','Allied radar satellite','prot','Protect'],
         ['p-kite','TRK 4417','Unflagged inspector','unk','The shadow'],['p-station','GANYMEDE STN','Listening post','own','Your ears']];
  return '<div class="cast">'+c.map(function(x){return '<div class="who-c '+x[3]+'"><div class="pic"><img src="img/'+x[0]+'.png" alt=""></div><span class="flag">'+x[4]+'</span><b>'+x[1]+'</b><small>'+x[2]+'</small></div>';}).join('')+'</div>';},
 win:function(){
  return '<div class="win"><div class="flow">'+
   '<div class="w"><img src="img/i-jam.png" alt=""><b>Jam its link</b><small>Key 7</small></div><svg class="ico ar"><use href="#i-arrow"/></svg>'+
   '<div class="w"><div class="hrs">3<span>h</span></div><div class="bar3"><i></i><i></i><i></i></div><b>Hold it</b><small>within 200 km of ORIEL-36</small></div><svg class="ico ar"><use href="#i-arrow"/></svg>'+
   '<div class="w"><img src="img/p-kite.png" alt="" class="kite"><b>It leaves</b><small>You win</small></div></div>'+
   '<div class="lose"><span class="lt">You lose if</span>'+
   [['i-clock','It finishes its look'],['i-sat','ORIEL-36 is hurt'],['i-debris','Any debris'],['i-flag','Escalation hits 100']].map(function(x){return '<span class="l"><svg class="ico"><use href="#'+x[0]+'"/></svg>'+x[1]+'</span>';}).join('')+
   '<span class="l bonus"><svg class="ico"><use href="#i-star"/></svg>Bonus: identify its radio</span></div></div>';},
 ends:function(){
  var b=[['It finished its look','Get alongside sooner; jam earlier'],['It went silent','Listen before you move'],['Open war','Fewer loud acts; stop jamming once it leaves'],['Debris','Never use the KV here']];
  return '<div class="ends"><div class="end good"><span class="stamp">Good end</span><b>The inspector departs</b><small>Cut off for 3 h · no debris · below war</small></div>'+
   b.map(function(x){return '<div class="end bad"><span class="stamp">Bad end</span><b>'+x[0]+'</b><small>Try: '+x[1]+'</small></div>';}).join('')+'</div>';},
 finish:function(){
  return '<div class="title fin"><div class="kick">End of the tour</div><h2 class="h">You\'re ready, Operator.</h2>'+
   '<ol class="order">'+[['4','Buoy'],[']','Time'],['F2','Hear'],['D','Find'],['I','Identify'],['F3','Plan'],['3','Match'],['6','Dark'],['2','Look'],['7','Jam 3 h']].map(function(x){return '<li>'+kb(x[0])+'<span>'+x[1]+'</span></li>';}).join('')+'</ol>'+
   '<div class="btns"><a class="btn big" href="../game/"><svg class="ico"><use href="#i-play"/></svg>Play The Shadowing</a>'+
   '<a class="btn ghost big" href="reference.html"><svg class="ico"><use href="#i-book"/></svg>Quick reference</a>'+
   '<button class="btn ghost big" data-go="0"><svg class="ico"><use href="#i-back"/></svg>Start again</button></div></div>';}
};

function phone(){return window.matchMedia('(max-width:760px)').matches;}

function layout(){
  var s=S[cur]; if(!s)return;
  var sw=view.clientWidth, sh=view.clientHeight;
  var dl=(!phone()&&!dlg.hidden)?dlg.offsetHeight+28:0, fh=sh-dl;
  var k0=Math.max(sw/W,sh/H), k=k0, tx, ty, r=s.spot;
  if(r){
    var auto=Math.min(.58*sw/r[2], .62*fh/r[3]);
    k=Math.max(Math.min(auto, k0*(phone()?3:2.2), 2.4), Math.min(k0,auto));
    var cx=r[0]+r[2]/2, cy=r[1]+r[3]/2;
    tx=sw/2-cx*k; ty=fh/2-cy*k;
    var ctx=Math.min(0,Math.max(sw-W*k,tx)), cty=Math.min(0,Math.max(sh-H*k,ty));
    var inx=(r[0]*k+ctx>=8)&&((r[0]+r[2])*k+ctx<=sw-8), iny=(r[1]*k+cty>=8)&&((r[1]+r[3])*k+cty<=fh-8);
    if(inx)tx=ctx; if(iny)ty=cty;
  } else {
    if(s.panel&&!phone()){k=k0*1.04;}
    tx=(sw-W*k)/2; ty=(sh-H*k)/2;
  }
  layer.style.transform='translate('+tx.toFixed(1)+'px,'+ty.toFixed(1)+'px) scale('+k.toFixed(4)+')';
  if(r){
    var p=8; spot.className='spot on'+(s.click?' click':'');
    spot.style.left=(r[0]*k+tx-p)+'px'; spot.style.top=(r[1]*k+ty-p)+'px';
    spot.style.width=(r[2]*k+2*p)+'px'; spot.style.height=(r[3]*k+2*p)+'px';
  } else {
    spot.className='spot'+(s.panel||s.dim||s.who?' dim':'');
    spot.style.left=sw/2+'px';spot.style.top=fh/2+'px';spot.style.width='0px';spot.style.height='0px';
  }
  stage.style.setProperty('--dl',dl+'px');
}

function setBg(name){
  var src='tour/'+name+'.webp', a=imgs[front];
  if(a.getAttribute('src')===src)return;
  var b=imgs[1-front]; b.onload=function(){b.classList.add('show');a.classList.remove('show');};
  b.src=src; front=1-front; if(b.complete&&b.naturalWidth)b.onload();
}

function words(html){
  // wrap each word in a span so the line can be revealed word by word
  var d=document.createElement('div');d.innerHTML=html;var n=0;
  (function walk(el){Array.prototype.slice.call(el.childNodes).forEach(function(c){
    if(c.nodeType===3){var f=document.createDocumentFragment();c.textContent.split(/(\s+)/).forEach(function(w){
      if(!w)return; if(/^\s+$/.test(w)){f.appendChild(document.createTextNode(w));return;}
      var sp=document.createElement('span');sp.className='wd';sp.style.animationDelay=(n++*28)+'ms';sp.textContent=w;f.appendChild(sp);});
      el.replaceChild(f,c);} else walk(c);});})(d);
  return d.innerHTML;
}

function show(i,push){
  i=Math.max(0,Math.min(S.length-1,i)); var s=S[i], prev=S[cur]; cur=i;
  setBg(s.bg);
  document.body.classList.toggle('titled',s.panel==='title'||s.panel==='finish');
  // chapter card on the first slide of a chapter
  var cc=$('chapcard'); cc.classList.remove('show');
  if(i===firstOf[s.c]&&s.c>0){$('chapno').textContent='Chapter '+s.c;$('chapname').textContent=CH[s.c];void cc.offsetWidth;cc.classList.add('show');}
  cards.innerHTML=s.panel?PANELS[s.panel]():''; cards.className='cards'+(s.panel?' on p-'+s.panel:'');
  dlg.hidden=!s.who;
  if(s.who){
    var w=WHO[s.who]; $('face').src=w.img; $('who').textContent=w.n; $('where').textContent=w.s;
    dlg.classList.toggle('red',!!w.red);
    var L=$('line'); L.className='line'+(s.radio?' radio':''); L.innerHTML=words(s.radio?'<b>|| </b>'+s.t+'<b> ||</b>':s.t);
    dlg.classList.remove('done'); clearTimeout(typing); typing=setTimeout(function(){dlg.classList.add('done');},L.querySelectorAll('.wd').length*28+300);
    $('do').innerHTML=s.keys?'<span class="dl">'+(s.click?'Do':'Keys')+'</span>'+s.keys.map(function(k){return '<span class="k">'+kb(k[0])+'<em>'+k[1]+'</em></span>';}).join(''):(s.click?'<span class="dl">Do</span><span class="k"><svg class="ico"><use href="#i-mouse"/></svg><em>Click the lit part in the game</em></span>':'');
    $('count').textContent=(i<9?'0':'')+i+' / '+(S.length-1);
    $('back').disabled=i===0;
    $('nextlabel').textContent=i===S.length-2?'Finish':'Next';
  }
  $('tag').textContent=s.tag||'';
  var chs=document.querySelectorAll('#chapters a');
  for(var j=0;j<chs.length;j++){chs[j].classList.toggle('on',+chs[j].dataset.c===s.c);chs[j].classList.toggle('past',+chs[j].dataset.c<s.c);}
  var on=document.querySelector('#chapters a.on'); if(on&&on.scrollIntoView&&phone())on.scrollIntoView({block:'nearest',inline:'center'});
  $('prog').style.width=(100*i/(S.length-1))+'%';
  layout(); requestAnimationFrame(layout);
  if(push!==false)history.replaceState(null,'','#s'+(i+1));
  // warm the next background
  var nx=S[i+1]; if(nx){var im=new Image();im.src='tour/'+nx.bg+'.webp';}
}

function next(){ if(!dlg.hidden&&!dlg.classList.contains('done')){dlg.classList.add('done');return;} show(cur+1); }
function back(){ show(cur-1); }
$('next').onclick=function(e){e.stopPropagation();next();};
$('back').onclick=function(e){e.stopPropagation();back();};
stage.addEventListener('click',function(e){
  var g=e.target.closest('[data-go]'); if(g){show(+g.dataset.go);return;}
  if(e.target.closest('a,button,.cards.on'))return; next();
});
document.addEventListener('keydown',function(e){
  if(e.altKey||e.ctrlKey||e.metaKey)return;
  if(['ArrowRight','PageDown',' ','Enter'].indexOf(e.key)>=0){e.preventDefault();next();}
  else if(['ArrowLeft','PageUp','Backspace'].indexOf(e.key)>=0){e.preventDefault();back();}
  else if(e.key==='Home'){show(0);} else if(e.key==='End'){show(S.length-1);}
});
var tx0=null;
stage.addEventListener('touchstart',function(e){tx0=e.touches[0].clientX;},{passive:true});
stage.addEventListener('touchend',function(e){if(tx0==null)return;var dx=e.changedTouches[0].clientX-tx0;tx0=null;if(Math.abs(dx)>50){dx<0?show(cur+1):show(cur-1);}},{passive:true});
